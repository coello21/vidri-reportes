<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reportes CD Nejapa</title>
<style>
  :root{--bg:#EEE7D9;--card:#F6F1E6;--line:#D8CFBE;--ink:#26241F;--mut:#6F685C;--red:#D7262B}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif}
  main{max-width:720px;margin:0 auto;padding:40px 16px}
  .eb{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--mut)}
  h1{font-family:Georgia,'Times New Roman',serif;font-size:32px;margin:6px 0 4px;border-bottom:3px solid var(--red);padding-bottom:12px}
  p{color:#4d483f;line-height:1.5}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:24px}
  a.card{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px}
  a.card:hover{border-color:var(--ink)}
  a.card b{display:block;font-size:18px;margin-bottom:4px}
  a.card span{font-size:14px;color:var(--mut)}
  .soon{opacity:.55;pointer-events:none}
</style>
</head>
<body>
<main>
  <div class="eb">CD Nejapa · Almacenes Vidrí</div>
  <h1>Reportes de preparación</h1>
  <p>Los datos se guardan en la base de datos. Entra con tu correo, carga los Excel y descarga los HTML para compartir.</p>
  <div class="grid">
    <a class="card" href="radar/"><b>Radar de Negados</b><span>Negados por día, top de códigos, preparadores y pedidos CD.</span></a>
    <a class="card soon" href="#"><b>Productividad</b><span>Próximamente.</span></a>
  </div>
</main>
</body>
</html>
